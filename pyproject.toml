[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "rtide-optimizer"
version = "1.0.0"
description = "RTI-DE: Rejected-Trial Interpolation Differential Evolution for box-constrained continuous minimisation"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Emine Ayaz" }]
requires-python = ">=3.9"
dependencies = ["numpy>=1.17"]
keywords = ["differential evolution", "evolutionary algorithm", "metaheuristic", "global optimization", "black-box optimization"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Operating System :: OS Independent",
    "Intended Audience :: Science/Research",
    "Topic :: Scientific/Engineering :: Mathematics",
]

[project.urls]
Repository = "https://github.com/ayazemine/rti-de"

[tool.setuptools]
package-dir = { "" = "python" }
packages = ["RTIDE"]
